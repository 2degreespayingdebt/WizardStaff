version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wizardstaff
      POSTGRES_USER: wizardstaff
      POSTGRES_PASSWORD: wizardstaff
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./packages/server
      dockerfile: ../Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://wizardstaff:wizardstaff@postgres:5432/wizardstaff
      JWT_SECRET: dev-secret-change-in-prod
      CLIENT_URL: http://localhost:5173

  client:
    build:
      context: ./packages/client
      dockerfile: ../Dockerfile
    ports:
      - "5173:5173"

volumes:
  postgres_data: